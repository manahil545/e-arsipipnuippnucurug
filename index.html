<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Arsip PR IPNU IPPNU Desa Curug</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .nav-active { color: #059669; }
        .nav-active svg { transform: translateY(-4px); transition: transform 0.2s; }
        .drawer-open { transform: translateY(0); }
        .drawer-closed { transform: translateY(100%); }
        .tab-active { background: linear-gradient(to right, #064e3b, #059669); color: white; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-emerald-50 text-slate-900 overflow-x-hidden">

    <!-- LOGIN PAGE -->
    <div id="page-login" class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden z-[100]">
        <div class="absolute inset-0 opacity-[0.03] flex items-center justify-center pointer-events-none">
            <img src="https://upload.wikimedia.org/wikipedia/id/8/87/Logo_IPNU.png" class="w-96 h-96 rotate-12" alt="">
        </div>
        <div class="w-full max-w-sm z-10 animate-in">
            <div class="flex flex-col items-center mb-8">
                <div class="flex -space-x-4 mb-4">
                    <div class="w-20 h-20 bg-white rounded-3xl p-3 shadow-xl border border-emerald-100 flex items-center justify-center"><img src="https://upload.wikimedia.org/wikipedia/id/8/87/Logo_IPNU.png" class="object-contain" alt=""></div>
                    <div class="w-20 h-20 bg-white rounded-3xl p-3 shadow-xl border border-emerald-100 flex items-center justify-center"><img src="https://upload.wikimedia.org/wikipedia/id/5/53/Logo_IPPNU.png" class="object-contain" alt=""></div>
                </div>
                <h1 class="text-2xl font-black text-emerald-900 uppercase text-center tracking-tighter">E-Arsip <br><span class="text-emerald-600 text-sm tracking-widest font-bold uppercase">Desa Curug</span></h1>
            </div>
            <div class="glass rounded-[40px] p-8 shadow-2xl border border-white">
                <form onsubmit="doLogin(event)" class="space-y-5">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Username</label>
                        <input type="text" placeholder="Masukkan username" class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm font-medium" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Password</label>
                        <input type="password" placeholder="••••••••" class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 focus:bg-white transition-all text-sm font-medium" required>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-emerald-800 to-emerald-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg border-b-4 border-emerald-900/20 active:scale-95 transition-all">Masuk Sekarang</button>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT (Hidden by default) -->
    <div id="main-app" class="hidden min-h-screen flex flex-col pb-24">
        <!-- Header -->
        <header class="bg-gradient-to-r from-emerald-900 via-emerald-700 to-emerald-600 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="flex -space-x-2">
                    <div class="w-9 h-9 bg-white rounded-full p-1 border-2 border-emerald-500"><img src="https://upload.wikimedia.org/wikipedia/id/8/87/Logo_IPNU.png" class="w-full h-full object-contain"></div>
                    <div class="w-9 h-9 bg-white rounded-full p-1 border-2 border-emerald-500"><img src="https://upload.wikimedia.org/wikipedia/id/5/53/Logo_IPPNU.png" class="w-full h-full object-contain"></div>
                </div>
                <div>
                    <h1 class="font-black text-base uppercase tracking-tighter">E-Arsip</h1>
                    <p class="text-[8px] text-emerald-100/90 font-bold tracking-widest">PR IPNU IPPNU DESA CURUG</p>
                </div>
            </div>
            <div class="bg-white/10 backdrop-blur-md p-2 rounded-xl border border-white/20">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main id="content" class="flex-1 p-5 relative overflow-x-hidden">
            <!-- DASHBOARD VIEW -->
            <div id="view-dashboard" class="space-y-6">
                <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-900 to-emerald-700 p-6 text-white shadow-xl">
                    <div class="absolute -bottom-4 -right-4 w-32 h-32 opacity-10 rotate-12"><img src="https://upload.wikimedia.org/wikipedia/id/8/87/Logo_IPNU.png" alt=""></div>
                    <div class="relative z-10">
                        <h2 class="text-xl font-black tracking-tight mb-1">Selamat Datang!</h2>
                        <p class="text-emerald-50/80 text-xs font-medium leading-relaxed">Kelola administrasi PR IPNU IPPNU Desa Curug dengan lebih modern dan profesional.</p>
                        <div class="mt-6 inline-block px-3 py-1 bg-white/10 backdrop-blur-md rounded-full border border-white/10 text-[9px] font-black uppercase tracking-widest">Tahun Khidmat 2024-2026</div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white p-4 rounded-2xl text-center shadow-sm border border-emerald-50">
                        <div class="mb-2 w-8 h-8 mx-auto bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="3" y2="15"/></svg></div>
                        <span class="text-[9px] text-emerald-800/60 font-black uppercase block mb-1">Masuk</span>
                        <span class="text-xl font-black text-emerald-950">124</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl text-center shadow-sm border border-emerald-50">
                        <div class="mb-2 w-8 h-8 mx-auto bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></div>
                        <span class="text-[9px] text-emerald-800/60 font-black uppercase block mb-1">Keluar</span>
                        <span class="text-xl font-black text-emerald-950">86</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl text-center shadow-sm border border-emerald-50">
                        <div class="mb-2 w-8 h-8 mx-auto bg-amber-50 text-amber-600 rounded-lg flex items-center justify-center"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg></div>
                        <span class="text-[9px] text-emerald-800/60 font-black uppercase block mb-1">Aset</span>
                        <span class="text-xl font-black text-emerald-950">42</span>
                    </div>
                </div>
            </div>

            <!-- LIST VIEW (Shared for Masuk, Keluar, Inventaris) -->
            <div id="view-list" class="hidden space-y-4">
                <div id="category-tabs" class="flex bg-emerald-100/50 backdrop-blur-md p-1.5 rounded-2xl gap-1 border border-emerald-200/50 shadow-inner mb-4">
                    <button onclick="setListCategory('ipnu')" id="tab-ipnu" class="flex-1 py-2.5 text-[10px] font-black rounded-xl transition-all uppercase tracking-widest tab-active">IPNU</button>
                    <button onclick="setListCategory('ippnu')" id="tab-ippnu" class="flex-1 py-2.5 text-[10px] font-black rounded-xl transition-all uppercase tracking-widest text-emerald-700">IPPNU</button>
                    <button onclick="setListCategory('bersama')" id="tab-bersama" class="flex-1 py-2.5 text-[10px] font-black rounded-xl transition-all uppercase tracking-widest text-emerald-700">Bersama</button>
                </div>

                <div class="relative mb-6">
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 text-emerald-400"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div>
                    <input type="text" placeholder="Cari arsip..." class="w-full pl-10 pr-4 py-3 bg-white border-2 border-emerald-50 rounded-2xl shadow-sm outline-none focus:border-emerald-500 transition-all text-sm">
                </div>

                <div id="archive-items" class="space-y-3">
                    <!-- Dynamic Items will be injected here -->
                </div>
            </div>
        </main>

        <!-- Floating Action Button -->
        <button id="fab" onclick="toggleDrawer(true)" class="hidden fixed bottom-24 right-6 w-16 h-16 bg-gradient-to-tr from-emerald-900 to-emerald-500 text-white rounded-2xl flex items-center justify-center shadow-xl z-40 active:scale-90 transition-all border-2 border-white/20 rotate-45">
            <div class="-rotate-45"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg></div>
        </button>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-emerald-100 px-6 py-3 flex justify-between items-center z-50">
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 nav-active">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                <span class="text-[9px] font-black uppercase tracking-tighter">Beranda</span>
            </button>
            <button onclick="switchTab('surat-masuk')" id="nav-surat-masuk" class="flex flex-col items-center gap-1 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <span class="text-[9px] font-black uppercase tracking-tighter">Masuk</span>
            </button>
            <button onclick="switchTab('surat-keluar')" id="nav-surat-keluar" class="flex flex-col items-center gap-1 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                <span class="text-[9px] font-black uppercase tracking-tighter">Keluar</span>
            </button>
            <button onclick="switchTab('inventaris')" id="nav-inventaris" class="flex flex-col items-center gap-1 text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                <span class="text-[9px] font-black uppercase tracking-tighter">Inventaris</span>
            </button>
        </nav>
    </div>

    <!-- DRAWER FORM -->
    <div id="drawer-overlay" onclick="toggleDrawer(false)" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[60] hidden opacity-0 transition-opacity duration-300"></div>
    <div id="drawer" class="fixed bottom-0 left-0 right-0 z-[70] bg-white rounded-t-[40px] shadow-2xl drawer-closed transition-transform duration-500 ease-out overflow-y-auto max-h-[90vh] p-8">
        <div class="flex justify-between items-center mb-6">
            <h2 id="drawer-title" class="text-xl font-black text-emerald-900 uppercase tracking-tighter">Arsip Baru</h2>
            <button onclick="toggleDrawer(false)" class="p-2 bg-emerald-50 rounded-full text-emerald-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <form class="space-y-5 pb-8" onsubmit="event.preventDefault(); toggleDrawer(false);">
            <div class="space-y-1">
                <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Kategori</label>
                <select class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 focus:bg-white text-sm font-bold transition-all">
                    <option>Surat IPNU</option>
                    <option>Surat IPPNU</option>
                    <option>Surat Bersama</option>
                </select>
            </div>
            <div class="grid grid-cols-3 gap-2">
                <label class="relative"><input type="radio" name="idx" class="peer hidden" checked><div class="py-3 text-center rounded-2xl border-2 border-emerald-50 text-slate-400 font-black text-xs peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 transition-all uppercase">A</div></label>
                <label class="relative"><input type="radio" name="idx" class="peer hidden"><div class="py-3 text-center rounded-2xl border-2 border-emerald-50 text-slate-400 font-black text-xs peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 transition-all uppercase">B</div></label>
                <label class="relative"><input type="radio" name="idx" class="peer hidden"><div class="py-3 text-center rounded-2xl border-2 border-emerald-50 text-slate-400 font-black text-xs peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 transition-all uppercase">C</div></label>
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Perihal / Nama</label>
                <input type="text" placeholder="Masukkan judul arsip" class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 text-sm font-medium">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Tanggal</label>
                    <input type="date" class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 text-sm">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">No. Surat</label>
                    <input type="text" placeholder="001/A/..." class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 text-sm">
                </div>
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-black text-emerald-800/60 uppercase tracking-widest ml-1">Keterangan</label>
                <textarea placeholder="Catatan tambahan..." class="w-full bg-emerald-50/50 border-2 border-emerald-100 rounded-2xl py-3.5 px-4 outline-none focus:border-emerald-500 text-sm min-h-[100px]"></textarea>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-800 to-emerald-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl border-b-4 border-emerald-900/20 active:scale-95 transition-all">Simpan Arsip</button>
        </form>
    </div>

    <script>
        // NAVIGATION LOGIC
        let currentTab = 'dashboard';
        let currentCategory = 'ipnu';

        function doLogin(e) {
            e.preventDefault();
            document.getElementById('page-login').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        function switchTab(tab) {
            currentTab = tab;
            // Update UI Nav
            ['dashboard', 'surat-masuk', 'surat-keluar', 'inventaris'].forEach(t => {
                const el = document.getElementById('nav-' + t);
                if (t === tab) {
                    el.classList.add('nav-active');
                    el.classList.remove('text-slate-400');
                } else {
                    el.classList.remove('nav-active');
                    el.classList.add('text-slate-400');
                }
            });

            // Update View
            if (tab === 'dashboard') {
                document.getElementById('view-dashboard').classList.remove('hidden');
                document.getElementById('view-list').classList.add('hidden');
                document.getElementById('fab').classList.add('hidden');
            } else {
                document.getElementById('view-dashboard').classList.add('hidden');
                document.getElementById('view-list').classList.remove('hidden');
                document.getElementById('fab').classList.remove('hidden');
                renderList();
            }
        }

        function setListCategory(cat) {
            currentCategory = cat;
            ['ipnu', 'ippnu', 'bersama'].forEach(c => {
                const el = document.getElementById('tab-' + c);
                if (c === cat) {
                    el.classList.add('tab-active');
                    el.classList.remove('text-emerald-700');
                } else {
                    el.classList.remove('tab-active');
                    el.classList.add('text-emerald-700');
                }
            });
            renderList();
        }

        function toggleDrawer(open) {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('drawer-overlay');
            if (open) {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.replace('opacity-0', 'opacity-100'), 10);
                drawer.classList.replace('drawer-closed', 'drawer-open');
                document.getElementById('drawer-title').innerText = currentTab === 'inventaris' ? 'Tambah Inventaris' : 'Surat ' + (currentTab.split('-')[1]) + ' Baru';
            } else {
                overlay.classList.replace('opacity-100', 'opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                drawer.classList.replace('drawer-open', 'drawer-closed');
            }
        }

        function renderList() {
            const container = document.getElementById('archive-items');
            container.innerHTML = '';
            
            const dummyData = [
                { title: 'Undangan Konancab', code: '042/PR/A/7354/X/2023', date: '12 Okt 2023', person: 'PAC IPNU IPPNU', idx: 'A', note: 'Wajib hadir' },
                { title: 'Permohonan Delegasi', code: '043/PR/B/7354/X/2023', date: '15 Okt 2023', person: 'MWCNU Curug', idx: 'B', note: 'Sudah disposisi' },
                { title: 'Laporan Semesteran', code: '044/PR/C/7354/XI/2023', date: '02 Nov 2023', person: 'PC IPNU IPPNU', idx: 'C', note: 'Lengkap' }
            ];

            dummyData.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white/80 backdrop-blur-sm p-4 rounded-3xl shadow-sm border border-emerald-50 flex gap-4 relative overflow-hidden animate-in';
                div.style.animationDelay = (i * 0.1) + 's';
                
                let iconColor = currentTab === 'surat-masuk' ? 'bg-blue-50 text-blue-600' : (currentTab === 'surat-keluar' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600');
                let icon = currentTab === 'inventaris' ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>' : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>';

                div.innerHTML = `
                    <div class="absolute -bottom-2 -right-2 w-16 h-16 opacity-[0.03] pointer-events-none rotate-12">
                        <img src="https://upload.wikimedia.org/wikipedia/id/8/87/Logo_IPNU.png" alt="">
                    </div>
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 shadow-inner ${iconColor}">
                        ${icon}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <h4 class="font-bold text-slate-800 text-sm truncate">${item.title}</h4>
                            <span class="shrink-0 bg-emerald-100 text-emerald-800 text-[9px] px-1.5 py-0.5 rounded font-black border border-emerald-200 uppercase">IND-${item.idx}</span>
                        </div>
                        <p class="text-[10px] text-gray-400 font-mono mt-0.5 truncate">${item.code}</p>
                        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-2 text-[10px] text-gray-500 font-bold uppercase tracking-tighter">
                            <span>${item.date}</span>
                            <span class="text-emerald-300">•</span>
                            <span>${item.person}</span>
                        </div>
                        <div class="mt-2 text-[10px] text-blue-600 bg-blue-50/50 px-2 py-0.5 rounded border border-blue-100 inline-block italic">Ket: ${item.note}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
